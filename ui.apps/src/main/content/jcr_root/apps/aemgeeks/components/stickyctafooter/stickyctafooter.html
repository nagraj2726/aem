<!-- Hide Sticky CTA Footer if disabled in Page Properties -->
<sly data-sly-test="${!currentPage.properties.disableStickyFooter}">

    <sly data-sly-use.model="com.aem.geeks.core.models.StickyCtaFooterModel"/>

    <div class="sticky-cta-footer">

        <!-- Primary CTA -->
        <a href="${model.primaryLink}"
           target="_blank"
           class="cta-btn availability">
            <span class="icon">💻</span>
            <span>${model.primaryCta}</span>
        </a>

        <!-- Secondary CTA -->
       <a href="${model.secondaryLink}" class="cta-btn order call-order-link"> 
       <span class="call-icon">📞</span> 
       <span class="call-text">Call to Order</span> 
       <span class="call-number">${model.phoneNumber}</span>
	</a>
    </div>

</sly>

<!-- Load ClientLib -->
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
    <sly data-sly-call="${clientlib.all @ categories='aemgeeks.stickyctafooter'}"/>
</sly>
